name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imta
          POSTGRES_PASSWORD: imta
          POSTGRES_DB: imta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://imta:imta@localhost:5432/imta
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm smoke
      - run: pnpm build
